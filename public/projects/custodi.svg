  <text x="158" y="663" fill="#e9eeee" font-family="Arial,sans-serif" font-size="21">“Congratulations! You are selected. Pay a small</text><text x="158" y="696" fill="#e9eeee" font-family="Arial,sans-serif" font-size="21">processing fee to secure your offer today.”</text>
